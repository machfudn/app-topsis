version: '3.8'

services:
  apache:
    build: .
    image: app-topsis-php:8.3
    container_name: topsis_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-app-topsis}
      - DB_USER=${DB_USER:-topsis_user}
      - DB_PASSWORD=${DB_PASSWORD:-topsis_secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - topsis_network

  mysql:
    image: mysql:8.0
    container_name: topsis_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-app-topsis}
      MYSQL_USER: ${DB_USER:-topsis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-topsis_secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - topsis_network

networks:
  topsis_network:
    driver: bridge
